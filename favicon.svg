<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e0a12" />
      <stop offset="85%" stop-color="#09050d" />
      <stop offset="100%" stop-color="#020104" />
    </radialGradient>
    
    <!-- Crimson Neon Gradient -->
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Cyan Target Accent -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" stroke="#38101e" stroke-width="1.5" />

  <!-- Targeting Grid Reticle (Subtle) -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#ef4444" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 3" />
  <line x1="32" y1="4" x2="32" y2="14" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="32" y1="50" x2="32" y2="60" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="4" y1="32" x2="14" y2="32" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="50" y1="32" x2="60" y2="32" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- Stylized Cyber Skull / Zombie Silhouette -->
  <g filter="url(#glow)">
    <!-- Skull Cranium -->
    <path d="M20 28 C20 18 25 15 32 15 C39 15 44 18 44 28 C44 34 42 37 40 39 L40 44 C40 45.5 38.5 47 37 47 L27 47 C25.5 47 24 45.5 24 44 L24 39 C22 37 20 34 20 28 Z" 
          fill="url(#neonRed)" />
    
    <!-- Eye Sockets (Glowing Cyan Reticle Eyes) -->
    <ellipse cx="27" cy="29" rx="3.5" ry="4" fill="#050308" />
    <circle cx="27" cy="29" r="1.5" fill="#38bdf8" />
    
    <ellipse cx="37" cy="29" rx="3.5" ry="4" fill="#050308" />
    <circle cx="37" cy="29" r="1.5" fill="#38bdf8" />

    <!-- Nose Cavity -->
    <polygon points="32,34 30.5,38 33.5,38" fill="#050308" />

    <!-- Teeth Grille -->
    <rect x="27" y="42" width="2" height="4" rx="0.5" fill="#050308" />
    <rect x="31" y="42" width="2" height="4" rx="0.5" fill="#050308" />
    <rect x="35" y="42" width="2" height="4" rx="0.5" fill="#050308" />
  </g>

  <!-- Center Crosshair Dot -->
  <circle cx="32" cy="32" r="1" fill="#ffffff" />
</svg>
